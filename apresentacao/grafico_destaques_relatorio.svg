<svg width="1020" height="660" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background Supply Transformation -->
  <rect width="100%" height="100%" fill="#000000" rx="12" />

  <!-- Header -->
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Destaques do Relatório Oficial do Otimizador</text>
  <text x="30" y="62" font-family="Arial, sans-serif" font-size="13" fill="#d99200" font-weight="bold">Resultados Consolidados da Linha — Relatório relatorio_otimizador_20260813_085539.txt</text>
  <line x1="30" y1="76" x2="990" y2="76" stroke="#222222" stroke-width="1" />

  <!-- TOP KPI CARDS (3 CARDS) -->
  <!-- Card 1: Production Gain -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="300" height="110" fill="#0f172a" stroke="#16a34a" stroke-width="2" rx="8" />
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#86efac">GANHO DE PRODUÇÃO ESTIMADO</text>
    <text x="20" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">+11,39%</text>
    <text x="20" y="88" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">+1.833.085 unidades adicionais</text>
  </g>

  <!-- Card 2: Buffer Stops Avoided -->
  <g transform="translate(360, 95)">
    <rect x="0" y="0" width="300" height="110" fill="#0f172a" stroke="#06b6d4" stroke-width="2" rx="8" />
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">MELHORIA DE PARADAS DE BUFFER</text>
    <text x="20" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">21,8%</text>
    <text x="20" y="88" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#06b6d4">2.640 paradas de buffer evitadas</text>
  </g>

  <!-- Card 3: Reduced Speed Operation -->
  <g transform="translate(690, 95)">
    <rect x="0" y="0" width="300" height="110" fill="#0f172a" stroke="#d99200" stroke-width="2" rx="8" />
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fde047">MARCHA REDUZIDA PROTETIVA</text>
    <text x="20" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">11.125</text>
    <text x="20" y="88" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d99200">Amostras mantidas sem parar!</text>
  </g>

  <!-- SEÇÃO 2: VALORES DE PRODUÇÃO HISTÓRICOS VS OTIMIZADOS -->
  <text x="30" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#aaaaaa">1. PRODUÇÃO TOTAL DE EMBALAGENS (HISTÓRICO VS SIMULAÇÃO OTIMIZADA)</text>

  <g transform="translate(30, 250)">
    <rect x="0" y="0" width="960" height="85" fill="#18181b" stroke="#334155" rx="8" />
    
    <!-- Histórico -->
    <text x="25" y="32" font-family="Arial, sans-serif" font-size="12" fill="#aaaaaa">Produção Real Registrada no Histórico:</text>
    <text x="25" y="58" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ef4444">16.088.319 unidades</text>

    <!-- Arrow -->
    <text x="330" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#16a34a">→</text>

    <!-- Otimizado -->
    <text x="380" y="32" font-family="Arial, sans-serif" font-size="12" fill="#aaaaaa">Produção Simulada Otimizada:</text>
    <text x="380" y="58" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#16a34a">17.921.405 unidades</text>

    <!-- Delta Badge -->
    <rect x="710" y="18" width="220" height="50" fill="#14532d" stroke="#16a34a" stroke-width="1.5" rx="6" />
    <text x="820" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Δ GANHO REALIZADO</text>
    <text x="820" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#86efac">+1.833.085 (+11,39%)</text>
  </g>

  <!-- SEÇÃO 3: REGRAS E GATILHOS DE CONTROLE PARA O PLC -->
  <text x="30" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#aaaaaa">2. REGRAS SINTONIZADAS PELO OTIMIZADOR PARA PROGRAMAÇÃO NO PLC</text>

  <g transform="translate(30, 380)">
    <!-- Entrada Box -->
    <rect x="0" y="0" width="465" height="150" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" rx="8" />
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#06b6d4">🛡️ Cadeia de Entrada (Proteção Contra Falta)</text>

    <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Pulmão DPL-UIP (Extremo):</tspan> Reduz a <tspan font-weight="bold" fill="#fde047">95% (39.900 CPH)</tspan> se B1 &lt; 20%</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">  Retorna para 100% quando B1 &gt; 30.0%</text>

    <text x="20" y="105" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Pulmão UIP-ECH (Interno):</tspan> Reduz a <tspan font-weight="bold" fill="#fde047">85% (35.700 CPH)</tspan> se B2 &lt; 34,2%</text>
    <text x="20" y="125" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">  Retorna para 100% quando B2 &gt; 44.2%</text>

    <!-- Saída Box -->
    <rect x="495" y="0" width="465" height="150" fill="#0f172a" stroke="#eab308" stroke-width="1.5" rx="8" />
    <text x="515" y="28" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#eab308">⚠️ Cadeia de Saída (Proteção Contra Acúmulo)</text>

    <text x="515" y="55" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Pulmão ECH-PZ (Interno):</tspan> Reduz a <tspan font-weight="bold" fill="#fde047">85% (35.700 CPH)</tspan> se B3 &gt; 80,0%</text>
    <text x="515" y="75" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">  Retorna para 100% quando B3 &lt; 70.0%</text>

    <text x="515" y="105" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Pulmão PZ-EPC (Extremo):</tspan> Reduz a <tspan font-weight="bold" fill="#fde047">95% (39.900 CPH)</tspan> se B4 &gt; 80,0%</text>
    <text x="515" y="125" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">  Retorna para 100% quando B4 &lt; 65.0%</text>
  </g>

  <!-- MODOS 100% E SPRINT (BOTTOM PANEL) -->
  <g transform="translate(30, 550)">
    <rect x="0" y="0" width="960" height="85" fill="#14532d" stroke="#16a34a" stroke-width="1.5" rx="8" />
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">🚀 CONDIÇÕES DE OPERAÇÃO EM ALTA VELOCIDADE &amp; SPRINT</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="11" fill="#86efac">• <tspan font-weight="bold" fill="#ffffff">Modo Alta (100% = 42.000 CPH):</tspan> B1 &gt; 30.0% | B2 &gt; 44,2% | B3 &lt; 70,0% | B4 &lt; 65,0%</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#86efac">• <tspan font-weight="bold" fill="#ffffff">Modo Sprint (101% = 42.420 CPH):</tspan> B1 &gt; 35.0% | B2 &gt; 49,2% | B3 &lt; 65,0% | B4 &lt; 60,0% (5% de Margem Extra de Segurança)</text>
  </g>
</svg>
