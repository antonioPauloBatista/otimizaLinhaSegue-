<svg width="800" height="380" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Black Background -->
  <rect width="100%" height="100%" fill="#000000" />

  <!-- ELEMENT 1: SCADA / HMI BUFFER BOX (29%) -->
  <g transform="translate(275, 40)">
    <!-- Outer HMI Frame -->
    <rect x="0" y="0" width="250" height="110" fill="#000000" stroke="#86efac" stroke-width="2" rx="8" />
    <text x="125" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#86efac">TELA DA IHM / SCADA NO CLP</text>
    
    <!-- White Box with 29% & Green Fill Portion -->
    <g transform="translate(25, 33)">
      <rect x="0" y="0" width="200" height="52" fill="#ffffff" stroke="#333333" stroke-width="1.5" rx="3" />
      <rect x="150" y="1" width="49" height="50" fill="#bbf7d0" stroke="#16a34a" stroke-width="1" />
      <text x="80" y="36" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#000000">29%</text>
    </g>

    <text x="125" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Buffer 2 (Nível de Acúmulo Instantâneo)</text>
  </g>

  <!-- CONNECTING ARROW / LINES -->
  <g transform="translate(400, 155)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#86efac" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="0,45 -6,33 6,33" fill="#86efac" />
  </g>

  <!-- ELEMENT 2: BELT WITH 5 SENSORS -->
  <g transform="translate(150, 215)">
    <text x="250" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Como os Sensores Formam o Valor de 29%?</text>

    <!-- 5 OPTICAL SENSORS -->
    
    <!-- Sensor 1 (20%) - ACTIVE / GREEN -->
    <g transform="translate(70, 48)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#86efac" text-anchor="middle">S1 (20%)</text>
      <path d="M -7 10 L 7 10 L 2 24 L -2 24 Z" fill="#86efac" />
    </g>

    <!-- Sensor 2 (40%) -->
    <g transform="translate(160, 48)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">S2 (40%)</text>
      <path d="M -7 10 L 7 10 L 2 24 L -2 24 Z" fill="#64748b" />
    </g>

    <!-- Sensor 3 (60%) -->
    <g transform="translate(250, 48)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">S3 (60%)</text>
      <path d="M -7 10 L 7 10 L 2 24 L -2 24 Z" fill="#64748b" />
    </g>

    <!-- Sensor 4 (80%) -->
    <g transform="translate(340, 48)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">S4 (80%)</text>
      <path d="M -7 10 L 7 10 L 2 24 L -2 24 Z" fill="#64748b" />
    </g>

    <!-- Sensor 5 (100%) -->
    <g transform="translate(430, 48)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">S5 (100%)</text>
      <path d="M -7 10 L 7 10 L 2 24 L -2 24 Z" fill="#64748b" />
    </g>

    <!-- CONVEYOR BELT LOOP -->
    <g transform="translate(20, 85)">
      <rect x="0" y="0" width="460" height="28" fill="#18181b" stroke="#ffffff" stroke-width="4" rx="14" />
      <!-- Left Roller -->
      <circle cx="16" cy="14" r="9" fill="#ffffff" />
      <!-- Right Roller -->
      <circle cx="444" cy="14" r="9" fill="#ffffff" />

      <!-- Sensor Indicator LEDs on Belt -->
      <circle cx="50" cy="14" r="4.5" fill="#86efac" />
      <circle cx="140" cy="14" r="4.5" fill="#334155" />
      <circle cx="230" cy="14" r="4.5" fill="#334155" />
      <circle cx="320" cy="14" r="4.5" fill="#334155" />
      <circle cx="410" cy="14" r="4.5" fill="#334155" />
    </g>
  </g>

</svg>
