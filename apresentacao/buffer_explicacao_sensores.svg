<svg width="1080" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="#000000" rx="16" />

  <!-- HEADER -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">MAPEAMENTO DO BUFFER NA IHM / SCADA VS SENSORES DA ESTEIRA</text>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d99200">Como a leitura percentual do Buffer (ex: 29% no CLP) é calculada pelos 5 sensores físicos de acúmulo</text>
    <line x1="0" y1="36" x2="1000" y2="36" stroke="#222222" stroke-width="1" />
  </g>

  <!-- ==================== TOP ARCHITECTURE LINE (IHM FACTORY STYLE) ==================== -->

  <!-- DPL (Depalletizer) -->
  <g transform="translate(50, 115)">
    <text x="40" y="-14" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">DPL</text>
    <rect x="0" y="0" width="80" height="60" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" rx="4" />
    <rect x="10" y="12" width="40" height="36" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <line x1="10" y1="26" x2="50" y2="26" stroke="#ffffff" stroke-width="1.5" />
    <rect x="-12" y="25" width="12" height="15" fill="#ffffff" />
    <line x1="15" y1="60" x2="15" y2="72" stroke="#ffffff" stroke-width="2.5" />
    <line x1="65" y1="60" x2="65" y2="72" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Conveyor DPL -> UIP -->
  <g transform="translate(130, 155)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#ffffff" stroke-width="3" />
    <rect x="8" y="-6" width="34" height="12" fill="none" stroke="#ffffff" stroke-width="2" rx="6" />
  </g>

  <!-- UIP (Unpack / Inspector / Washer) -->
  <g transform="translate(180, 115)">
    <text x="40" y="-14" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">UIP</text>
    <rect x="0" y="0" width="80" height="60" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" rx="4" />
    <circle cx="25" cy="30" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <rect x="48" y="15" width="20" height="28" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <line x1="15" y1="60" x2="15" y2="72" stroke="#ffffff" stroke-width="2.5" />
    <line x1="65" y1="60" x2="65" y2="72" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Conveyor UIP -> Buffer 2 -->
  <g transform="translate(260, 155)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- BUFFER 2 (INDUSTRIAL SCADA / HMI BUFFER GAUGE - 29%) -->
  <g transform="translate(295, 115)">
    <!-- Label Above -->
    <text x="60" y="-14" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fde047">Buffer 2 (Entrada)</text>
    
    <!-- HMI Buffer Box (Matching the User's Screenshot: 29% Green Gauge) -->
    <rect x="0" y="0" width="120" height="58" fill="#18181b" stroke="#86efac" stroke-width="2.5" rx="4" />
    
    <!-- Inner Gauge Box -->
    <rect x="8" y="8" width="104" height="42" fill="#ffffff" stroke="#333333" stroke-width="1" rx="2" />
    <!-- Filled Portion (29% in light green #dcfce7 / #86efac) -->
    <rect x="82" y="9" width="29" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <!-- 29% Text -->
    <text x="45" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">29%</text>

    <text x="60" y="73" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#86efac">Indicador IHM / CLP</text>
  </g>

  <!-- Conveyor Buffer 2 -> ECH -->
  <g transform="translate(415, 155)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- ECH (Enchedora - Filler) -->
  <g transform="translate(450, 95)">
    <text x="50" y="-18" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">ECH</text>
    <text x="50" y="-4" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Enchedora</text>
    <rect x="0" y="15" width="100" height="70" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" rx="4" />
    <path d="M 20 25 L 20 38 M 35 25 L 35 38 M 50 25 L 50 38 M 65 25 L 65 38 M 80 25 L 80 38" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 17 48 L 23 48 L 23 72 L 17 72 Z M 32 48 L 38 48 L 38 72 L 32 72 Z M 47 48 L 53 48 L 53 72 L 47 72 Z M 62 48 L 68 48 L 68 72 L 62 72 Z M 77 48 L 83 48 L 83 72 L 77 72 Z" fill="#ffffff" />
    <line x1="15" y1="85" x2="15" y2="92" stroke="#ffffff" stroke-width="2.5" />
    <line x1="85" y1="85" x2="85" y2="92" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Conveyor ECH -> PZ -->
  <g transform="translate(550, 155)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#ffffff" stroke-width="3" />
    <rect x="10" y="-6" width="40" height="12" fill="none" stroke="#ffffff" stroke-width="2" rx="6" />
    <line x1="20" y1="6" x2="20" y2="25" stroke="#ffffff" stroke-width="2" />
    <line x1="40" y1="6" x2="40" y2="25" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- PZ (Pasteurizer) -->
  <g transform="translate(610, 115)">
    <text x="35" y="-14" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">PZ</text>
    <rect x="0" y="0" width="70" height="60" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" rx="4" />
    <line x1="15" y1="18" x2="55" y2="18" stroke="#ffffff" stroke-width="2" />
    <line x1="15" y1="30" x2="55" y2="30" stroke="#ffffff" stroke-width="2" />
    <line x1="15" y1="42" x2="55" y2="42" stroke="#ffffff" stroke-width="2" />
    <line x1="15" y1="60" x2="15" y2="72" stroke="#ffffff" stroke-width="2.5" />
    <line x1="55" y1="60" x2="55" y2="72" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Conveyor PZ -> EPC -->
  <g transform="translate(680, 155)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#ffffff" stroke-width="3" />
    <rect x="10" y="-6" width="40" height="12" fill="none" stroke="#ffffff" stroke-width="2" rx="6" />
    <line x1="20" y1="6" x2="20" y2="25" stroke="#ffffff" stroke-width="2" />
    <line x1="40" y1="6" x2="40" y2="25" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- EPC (Packer / Encaiixotadora) -->
  <g transform="translate(760, 115)">
    <text x="40" y="-14" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">EPC</text>
    <rect x="0" y="0" width="80" height="60" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" rx="4" />
    <rect x="20" y="18" width="40" height="32" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="15" y1="60" x2="15" y2="72" stroke="#ffffff" stroke-width="2.5" />
    <line x1="65" y1="60" x2="65" y2="72" stroke="#ffffff" stroke-width="2.5" />
  </g>


  <!-- ==================== CALLOUT LINES EXPANDING HMI 29% TO SENSOR DETAILS ==================== -->
  <line x1="310" y1="180" x2="270" y2="400" stroke="#86efac" stroke-width="2.5" stroke-dasharray="6,4" />
  <line x1="400" y1="180" x2="620" y2="400" stroke="#86efac" stroke-width="2.5" stroke-dasharray="6,4" />


  <!-- ==================== ACTION ARROW TO ECH ==================== -->
  <g transform="translate(505, 210)">
    <path d="M 0 210 C 35 130, 35 60, -15 10" fill="none" stroke="#d99200" stroke-width="6" stroke-linecap="round" />
    <polygon points="-15,0 -28,20 -3,18" fill="#d99200" />
    
    <rect x="30" y="80" width="220" height="50" fill="#0f172a" stroke="#d99200" stroke-width="1.5" rx="6" />
    <text x="140" y="102" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">REDUÇÃO DE VELOCIDADE</text>
    <text x="140" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fde047" text-anchor="middle">(75% DA NOMINAL)</text>
  </g>


  <!-- ==================== MAGNIFYING GLASS (EXPLICANDO O BUFFER DE 29%) ==================== -->

  <!-- Handle -->
  <rect x="585" y="710" width="45" height="150" fill="#d99200" rx="12" transform="rotate(-40, 585, 710)" />
  <rect x="590" y="715" width="35" height="140" fill="#b37800" rx="8" transform="rotate(-40, 585, 710)" />

  <!-- Circle Lens Frame -->
  <circle cx="440" cy="550" r="220" fill="#000000" stroke="#d99200" stroke-width="8" />

  <!-- INSIDE THE MAGNIFYING GLASS -->

  <!-- Title inside Lens -->
  <text x="440" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fde047" text-anchor="middle">COMO O BUFFER (29%) É MEDIDO NA ESTEIRA</text>

  <!-- 5 SENSORS TOP LABELS & FUNNELS -->

  <!-- Sensor 1 (20%) - ACTIVE / TRIGGERED -->
  <g transform="translate(280, 410)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Sensor 1</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#86efac" text-anchor="middle">(20%)</text>
    <path d="M -8 24 L 8 24 L 3 38 L -3 38 Z" fill="#86efac" />
    <rect x="-3" y="38" width="6" height="10" fill="#86efac" />
  </g>

  <!-- Sensor 2 (40%) -->
  <g transform="translate(360, 410)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Sensor 2</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#06b6d4" text-anchor="middle">(40%)</text>
    <path d="M -8 24 L 8 24 L 3 38 L -3 38 Z" fill="#06b6d4" />
    <rect x="-3" y="38" width="6" height="10" fill="#06b6d4" />
  </g>

  <!-- Sensor 3 (60%) -->
  <g transform="translate(440, 410)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Sensor 3</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">(60%)</text>
    <path d="M -8 24 L 8 24 L 3 38 L -3 38 Z" fill="#10b981" />
    <rect x="-3" y="38" width="6" height="10" fill="#10b981" />
  </g>

  <!-- Sensor 4 (80%) -->
  <g transform="translate(520, 410)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Sensor 4</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#eab308" text-anchor="middle">(80%)</text>
    <path d="M -8 24 L 8 24 L 3 38 L -3 38 Z" fill="#eab308" />
    <rect x="-3" y="38" width="6" height="10" fill="#eab308" />
  </g>

  <!-- Sensor 5 (100%) -->
  <g transform="translate(600, 410)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Sensor 5</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">(100%)</text>
    <path d="M -8 24 L 8 24 L 3 38 L -3 38 Z" fill="#ef4444" />
    <rect x="-3" y="38" width="6" height="10" fill="#ef4444" />
  </g>

  <!-- CONVEYOR BELT IN MAGNIFYING GLASS -->
  <g transform="translate(240, 465)">
    <!-- Main Belt Frame -->
    <rect x="15" y="0" width="370" height="32" fill="none" stroke="#ffffff" stroke-width="5" rx="16" />
    <circle cx="31" cy="16" r="10" fill="#ffffff" />
    <circle cx="369" cy="16" r="10" fill="#ffffff" />
    
    <!-- Vertical Legs -->
    <line x1="60" y1="32" x2="60" y2="70" stroke="#ffffff" stroke-width="4" />
    <line x1="60" y1="70" x2="40" y2="70" stroke="#ffffff" stroke-width="4" />

    <line x1="170" y1="32" x2="170" y2="70" stroke="#ffffff" stroke-width="4" />

    <line x1="280" y1="32" x2="280" y2="70" stroke="#ffffff" stroke-width="4" />

    <line x1="340" y1="32" x2="340" y2="70" stroke="#ffffff" stroke-width="4" />
    <line x1="340" y1="70" x2="360" y2="70" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- ACCUMULATION READOUT SECTION (LEITURA ATUAL = 29%) -->
  <g transform="translate(440, 590)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ACCUMULATION READOUT ➔ 29% NA IHM</text>
    
    <!-- Progress Bar Frame -->
    <rect x="-130" y="14" width="260" height="20" fill="#18181b" stroke="#86efac" stroke-width="2" rx="10" />
    <!-- Filled Level (29% in bright green matching SCADA HMI) -->
    <rect x="-127" y="17" width="75" height="14" fill="#86efac" rx="7" />

    <!-- Percentage Labels -->
    <text x="-130" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="start">0%</text>
    <text x="-52" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#86efac" text-anchor="middle">29% (Atual)</text>
    <text x="130" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">100%</text>
  </g>

  <!-- SIDE EXPLANATION BOX (RIGHT SIDE) -->
  <g transform="translate(700, 360)">
    <rect x="0" y="0" width="340" height="360" fill="#0f172a" stroke="#86efac" stroke-width="1.5" rx="10" />
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#86efac">📊 RELAÇÃO IHM x SENSORES</text>
    
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">O indicador do Buffer na IHM (ex: <tspan font-weight="bold" fill="#86efac">29%</tspan>)</text>
    <text x="20" y="76" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">é calculado combinando o estado dos</text>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="11" stroke-width="0" fill="#cbd5e1">5 sensores ópticos instalados na esteira:</text>

    <!-- S1 -->
    <circle cx="30" cy="125" r="8" fill="#86efac" />
    <text x="45" y="129" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Sensor 1 (20%): <tspan font-weight="normal" fill="#86efac">Acionado (Garrafas Presentes)</tspan></text>

    <!-- S2 -->
    <circle cx="30" cy="160" r="8" fill="#06b6d4" />
    <text x="45" y="164" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Sensor 2 (40%): <tspan font-weight="normal" fill="#cbd5e1">Desacionado (Acúmulo em 29%)</tspan></text>

    <!-- S3 -->
    <circle cx="30" cy="195" r="8" fill="#10b981" />
    <text x="45" y="199" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Sensor 3 (60%): <tspan font-weight="normal" fill="#cbd5e1">Zona Nominal de Operação</tspan></text>

    <!-- S4 -->
    <circle cx="30" cy="230" r="8" fill="#eab308" />
    <text x="45" y="234" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Sensor 4 (80%): <tspan font-weight="normal" fill="#cbd5e1">Acúmulo Crítico</tspan></text>

    <!-- S5 -->
    <circle cx="30" cy="265" r="8" fill="#ef4444" />
    <text x="45" y="269" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Sensor 5 (100%): <tspan font-weight="normal" fill="#cbd5e1">Afogamento Extremo</tspan></text>

    <rect x="15" y="290" width="310" height="55" fill="#1e293b" stroke="#334155" rx="6" />
    <text x="25" y="310" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fde047">⚡ Decisão do Otimizador SEGUE:</text>
    <text x="25" y="326" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Com o Buffer em 29%, a IA modula a Enchedora</text>
    <text x="25" y="338" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">para evitar que o buffer zere (0%) e pare a linha.</text>
  </g>

  <!-- FOOTER -->
  <line x1="40" y1="855" x2="1040" y2="855" stroke="#222222" stroke-width="1" />
  <text x="540" y="880" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#666666">SUPPLY TRANSFORMATION | OTIMIZADOR SEGUE 2026</text>

</svg>
