<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Supply Transformation Dark Palette -->
  <rect width="100%" height="100%" fill="#000000" rx="8" />
  
  <!-- Title in White -->
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Adoção Global (Mês a Mês)</text>
  
  <!-- Big Current Number Badge (Gold Highlight Bar matching palette) -->
  <rect x="430" y="12" width="140" height="36" fill="#d99200" rx="4" />
  <text x="500" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">43,14%</text>

  <!-- Y Axis line -->
  <line x1="60" y1="80" x2="60" y2="250" stroke="#333333" stroke-width="1" />
  <!-- X Axis line -->
  <line x1="60" y1="250" x2="550" y2="250" stroke="#444444" stroke-width="2" />

  <g font-family="Arial, sans-serif" font-size="12" fill="#aaaaaa">
      <text x="50" y="254" text-anchor="end">38%</text>
      <text x="50" y="211" text-anchor="end">40%</text>
      <text x="50" y="168" text-anchor="end">42%</text>
      <text x="50" y="125" text-anchor="end">44%</text>
      <text x="50" y="84" text-anchor="end">46%</text>
      
      <!-- Grid lines (subtle dark slate) -->
      <line x1="60" y1="208" x2="550" y2="208" stroke="#222222" stroke-dasharray="4" />
      <line x1="60" y1="165" x2="550" y2="165" stroke="#222222" stroke-dasharray="4" />
      <line x1="60" y1="122" x2="550" y2="122" stroke="#222222" stroke-dasharray="4" />
      <line x1="60" y1="79" x2="550" y2="79" stroke="#222222" stroke-dasharray="4" />
      
      <!-- X axis labels -->
      <text x="120" y="270" text-anchor="middle" font-weight="bold" fill="#cccccc">Maio</text>
      <text x="240" y="270" text-anchor="middle" font-weight="bold" fill="#cccccc">Junho</text>
      <text x="360" y="270" text-anchor="middle" font-weight="bold" fill="#cccccc">Julho</text>
      <text x="480" y="270" text-anchor="middle" font-weight="bold" fill="#d99200">Agosto</text>
  </g>

  <!-- Line points computation:
       Y range: 38% (y=250) to 46% (y=80). Span = 8%. Pixels = 170. 1% = 21.25px.
       Maio: 39.85%   -> y = 210.69
       Junho: 39.95%  -> y = 208.56
       Julho: 39.93%  -> y = 208.99
       Agosto: 43.14% -> y = 140.78
  -->
  
  <!-- Main Trend Line in Gold Accent -->
  <polyline fill="none" stroke="#d99200" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
            points="120,210.69 240,208.56 360,208.99 480,140.78" />
  
  <!-- Data Points -->
  <circle cx="120" cy="210.69" r="5" fill="#000000" stroke="#d99200" stroke-width="2.5" />
  <circle cx="240" cy="208.56" r="5" fill="#000000" stroke="#d99200" stroke-width="2.5" />
  <circle cx="360" cy="208.99" r="5" fill="#000000" stroke="#d99200" stroke-width="2.5" />
  
  <!-- Highlight Agosto Data Point -->
  <circle cx="480" cy="140.78" r="8" fill="#d99200" stroke="#ffffff" stroke-width="2" />
  
  <!-- Data labels -->
  <text x="120" y="193" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#dddddd">39,85%</text>
  <text x="240" y="191" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#dddddd">39,95%</text>
  <text x="360" y="226" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#dddddd">39,93%</text>
  <text x="480" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#d99200">43,14%</text>

</svg>
