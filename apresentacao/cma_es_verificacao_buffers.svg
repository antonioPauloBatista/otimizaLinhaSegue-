<svg width="1000" height="620" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Supply Transformation Background -->
  <rect width="100%" height="100%" fill="#000000" rx="10" />

  <!-- Header -->
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Verificação Automática dos Buffers &amp; Fluxo do Algoritmo</text>
  <text x="30" y="62" font-family="Arial, sans-serif" font-size="13" fill="#d99200" font-weight="bold">Como o Otimizador identifica a topologia da fábrica e ajusta a busca</text>
  <line x1="30" y1="76" x2="970" y2="76" stroke="#222222" stroke-width="1" />

  <!-- PASSO 1: VERIFICAÇÃO DE EXISTÊNCIA DOS BUFFERS -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="940" height="155" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" rx="8" />
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#06b6d4">🔍 1. DETECÇÃO E VERIFICAÇÃO DE EXISTÊNCIA DOS BUFFERS (Resolução de Colunas)</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">O algoritmo varre as colunas do CSV / Banco de Dados e verifica a presença física dos sensores:</text>

    <!-- Buffer Check Cards -->
    <!-- B1 -->
    <g transform="translate(20, 62)">
      <rect x="0" y="0" width="205" height="75" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="6" />
      <text x="15" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Buffer B1 (Antes Entrada)</text>
      <rect x="15" y="35" width="80" height="22" fill="#16a34a" rx="4" />
      <text x="55" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">OPCIONAL</text>
      <text x="105" y="50" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">HAS_B1: Sim/Não</text>
    </g>

    <!-- B2 -->
    <g transform="translate(245, 62)">
      <rect x="0" y="0" width="205" height="75" fill="#1e293b" stroke="#d99200" stroke-width="1.5" rx="6" />
      <text x="15" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Buffer B2 (Entrada ECH)</text>
      <rect x="15" y="35" width="95" height="22" fill="#d99200" rx="4" />
      <text x="62" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#000000">OBRIGATÓRIO</text>
      <text x="120" y="50" font-family="Arial, sans-serif" font-size="11" fill="#d99200">✓ Ativo</text>
    </g>

    <!-- B3 -->
    <g transform="translate(470, 62)">
      <rect x="0" y="0" width="205" height="75" fill="#1e293b" stroke="#d99200" stroke-width="1.5" rx="6" />
      <text x="15" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Buffer B3 (Saída ECH)</text>
      <rect x="15" y="35" width="95" height="22" fill="#d99200" rx="4" />
      <text x="62" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#000000">OBRIGATÓRIO</text>
      <text x="120" y="50" font-family="Arial, sans-serif" font-size="11" fill="#d99200">✓ Ativo</text>
    </g>

    <!-- B4 -->
    <g transform="translate(695, 62)">
      <rect x="0" y="0" width="225" height="75" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="6" />
      <text x="15" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Buffer B4 (Pós Saída)</text>
      <rect x="15" y="35" width="80" height="22" fill="#16a34a" rx="4" />
      <text x="55" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">OPCIONAL</text>
      <text x="105" y="50" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">HAS_B4: Sim/Não</text>
    </g>
  </g>

  <!-- PASSO 2: CÁLCULO DE LIMITES FÍSICOS & DECISÃO ADAPTATIVA -->
  <g transform="translate(30, 265)">
    <rect x="0" y="0" width="455" height="150" fill="#0f172a" stroke="#d99200" stroke-width="1.5" rx="8" />
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d99200">📏 2. CÁLCULO AUTO DE LIMITES FÍSICOS</text>
    <text x="20" y="52" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• Analisa o histórico onde a Enchedora parou (Speed = 0).</text>
    <text x="20" y="74" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Limite de Falta Auto:</tspan> Percentil 15% do buffer B2 (~15%).</text>
    <text x="20" y="96" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Limite de Acúmulo Auto:</tspan> Percentil 85% do buffer B3 (~85%).</text>
    <text x="20" y="122" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Salva automaticamente no config_colunas.json para uso fabril.</text>

    <!-- Box Modo Free / Adaptativo -->
    <rect x="485" y="0" width="455" height="150" fill="#0f172a" stroke="#16a34a" stroke-width="1.5" rx="8" />
    <text x="505" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">⚡ 3. ADAPTAÇÃO DINÂMICA (Modo Free)</text>
    <text x="505" y="52" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Se B1/B4 existem:</tspan> Otimiza 8 parâmetros em 4 buffers.</text>
    <text x="505" y="74" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Se B1/B4 ausentes:</tspan> Ignora B1/B4 e otimiza B2 e B3.</text>
    <text x="505" y="96" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• <tspan font-weight="bold">Fator de Sobremarcha:</tspan> Ajusta velocidade máxima nominal.</text>
    <text x="505" y="122" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Flexibilidade total: Funciona em qualquer topologia de fábrica!</text>
  </g>

  <!-- PASSO 3: O QUE O ALGORITMO FAZ NA PRÁTICA (SIMULAÇÃO + EXECUÇÃO) -->
  <g transform="translate(30, 430)">
    <rect x="0" y="0" width="940" height="155" fill="#18181b" stroke="#06b6d4" stroke-width="1.5" rx="8" />
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#06b6d4">🚀 4. EXECUÇÃO DA OTIMIZAÇÃO NO GÊMEO DIGITAL</text>
    
    <!-- Flow Pipeline Steps -->
    <g transform="translate(20, 45)">
      <!-- Step A -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="270" height="85" fill="#0f172a" stroke="#334155" rx="6" />
        <text x="15" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d99200">A. Geração de Vetores de Teste</text>
        <text x="15" y="44" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Cria população de gatilhos (%) e</text>
        <text x="15" y="60" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">velocidades (% ECH) para os buffers.</text>
      </g>

      <!-- Arrow 1 -->
      <text x="282" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#06b6d4">→</text>

      <!-- Step B -->
      <g transform="translate(305, 0)">
        <rect x="0" y="0" width="280" height="85" fill="#0f172a" stroke="#334155" rx="6" />
        <text x="15" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#06b6d4">B. Simulação Segundo a Segundo</text>
        <text x="15" y="44" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Simula comportamento real da esteira:</text>
        <text x="15" y="60" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">evita paradas por soco e calcula OEE.</text>
      </g>

      <!-- Arrow 2 -->
      <text x="597" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#06b6d4">→</text>

      <!-- Step C -->
      <g transform="translate(625, 0)">
        <rect x="0" y="0" width="275" height="85" fill="#0f172a" stroke="#16a34a" rx="6" />
        <text x="15" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">C. Entrega de Setpoints Ótimos</text>
        <text x="15" y="44" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Retorna os gatilhos e velocidades de</text>
        <text x="15" y="60" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">maior produção líquida sem trancos.</text>
      </g>
    </g>
  </g>
</svg>
