<svg width="1000" height="750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Supply Transformation Dark Palette -->
  <rect width="100%" height="100%" fill="#000000" rx="16" />

  <!-- Outer Gold Accent Border -->
  <rect x="12" y="12" width="976" height="726" fill="none" stroke="#d99200" stroke-width="2" rx="14" />

  <!-- Header Banner -->
  <rect x="35" y="32" width="930" height="56" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="10" />
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">SLIDE 1: ADOÇÃO &amp; GOVERNANÇA DE DESEMPENHO</text>
  <text x="500" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d99200">OTIMIZADOR SEGUE 2026 — RESUMO EXECUTIVO DA MATRIZ OPERACIONAL</text>

  <!-- GRID DE 4 CARDS OPERACIONAIS -->

  <!-- CARD 1: DIAGNÓSTICO PÓS-IMPLANTAÇÃO -->
  <g transform="translate(35, 106)">
    <rect x="0" y="0" width="450" height="235" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" rx="10" />
    <rect x="15" y="15" width="32" height="32" fill="#ef4444" rx="6" />
    <text x="31" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
    <text x="60" y="36" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fca5a5">Diagnóstico Pós-Implantação</text>
    
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">⚠️ Causas de Perda Identificadas:</text>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Oscilações bruscas (hunting) na velocidade</text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Ruído e latência de rede nos sensores do buffer</text>
    <text x="20" y="128" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Descompasso com as rampas aceleração do PLC</text>
    
    <rect x="15" y="146" width="420" height="74" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="6" />
    <text x="25" y="166" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#a5b4fc">🔧 Plano de Ação Implementado:</text>
    <text x="25" y="184" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Filtros de histerese/suavização, validação de integridade</text>
    <text x="25" y="202" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">de sinal e alinhamento com a operação local.</text>
  </g>

  <!-- CARD 2: ENDEREÇAMENTO GLOBAL DO BENEFÍCIO -->
  <g transform="translate(515, 106)">
    <rect x="0" y="0" width="450" height="235" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" rx="10" />
    <rect x="15" y="15" width="32" height="32" fill="#06b6d4" rx="6" />
    <text x="31" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">2</text>
    <text x="60" y="36" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Benefício com Setpoints Iguais</text>

    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">📐 Problema Metrológico (ΔV = 0):</text>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Quando setpoint do otimizador é igual ao manual,</text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">a métrica tradicional mascarava os ganhos reais.</text>

    <rect x="15" y="128" width="420" height="92" fill="#164e63" stroke="#22d3ee" stroke-width="1" rx="6" />
    <text x="25" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#67e8f9">🚀 Solução Homologada (Global):</text>
    <text x="25" y="166" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Medição via Produção Líquida Realizada (Hl/Garrafas/h)</text>
    <text x="25" y="184" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">com A/B Testing dinâmico e contagem de microparadas</text>
    <text x="25" y="202" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">evitadas por afogamento/desabastecimento.</text>
  </g>

  <!-- CARD 3: IMPLANTAÇÃO NA CAMADA PLC -->
  <g transform="translate(35, 356)">
    <rect x="0" y="0" width="450" height="235" fill="#0f172a" stroke="#d99200" stroke-width="1.5" rx="10" />
    <rect x="15" y="15" width="32" height="32" fill="#d99200" rx="6" />
    <text x="31" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">3</text>
    <text x="60" y="36" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d99200">Implantação na Camada PLC</text>

    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">⚡ Arquitetura de Borda (Edge Computing):</text>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Migração do código de decisão para o PLC local</text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">usando padrão IEC 61131-3 em tempo real.</text>

    <rect x="15" y="128" width="420" height="92" fill="#1c1917" stroke="#d99200" stroke-width="1" rx="6" />
    <text x="25" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fde047">🛡️ Benefícios da Camada PLC:</text>
    <text x="25" y="166" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• Determinismo e baixíssima latência de malha fechada</text>
    <text x="25" y="184" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• Independência de oscilações de rede corporativa/nuvem</text>
    <text x="25" y="202" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• Intertravamentos de segurança e fail-safe nativos</text>
  </g>

  <!-- CARD 4: MATRIZ OBJETIVO DE DECISÃO -->
  <g transform="translate(515, 356)">
    <rect x="0" y="0" width="450" height="235" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="10" />
    <rect x="15" y="15" width="32" height="32" fill="#10b981" rx="6" />
    <text x="31" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">4</text>
    <text x="60" y="36" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Matriz Objetivo de Decisão</text>

    <!-- BOX PIORA -->
    <rect x="15" y="58" width="420" height="74" fill="#450a0a" stroke="#b91c1c" stroke-width="1.5" rx="6" />
    <text x="25" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5">❌ Se Comprovar PIORA na Linha:</text>
    <text x="25" y="98" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Submeter à refatoração técnica ou <tspan font-weight="bold" fill="#ef4444">MATAR A SOLUÇÃO</tspan></text>
    <text x="25" y="116" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5">(respeitando limites físicos da linha sem insistir no erro).</text>

    <!-- BOX MELHORA -->
    <rect x="15" y="144" width="420" height="76" fill="#064e3b" stroke="#059669" stroke-width="1.5" rx="6" />
    <text x="25" y="164" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7">✅ Se Comprovar MELHORA de Performance:</text>
    <text x="25" y="184" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Acionar PLANO DE COMUNICAÇÃO COM PACKAGING</text>
    <text x="25" y="202" font-family="Arial, sans-serif" font-size="11" fill="#6ee7b7">(One-Pagers, treinamento operacional e escala global).</text>
  </g>

  <!-- FOOTER BADGE / ADOÇÃO (43,14%) -->
  <g transform="translate(35, 606)">
    <rect x="0" y="0" width="930" height="100" fill="#18181b" stroke="#d99200" stroke-width="1.5" rx="10" />
    
    <text x="25" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fde047">📈 EVOLUÇÃO DE ADOÇÃO GLOBAL (MAIO A AGOSTO/2026)</text>
    
    <!-- Mini progress bar -->
    <rect x="25" y="48" width="680" height="24" fill="#27272a" rx="4" />
    <rect x="25" y="48" width="370" height="24" fill="#d99200" rx="4" />
    <text x="210" y="65" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Adoção Atual: 43,14% (Agosto)</text>

    <rect x="730" y="22" width="180" height="58" fill="#d99200" rx="8" />
    <text x="820" y="46" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">43,14%</text>
    <text x="820" y="66" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">ADOÇÃO GLOBAL</text>
  </g>

</svg>
