<svg width="500" height="280" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Presentation Palette Background -->
  <rect width="100%" height="100%" fill="#000000" rx="10" />

  <!-- Header -->
  <text x="250" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Evolução de Adoção — Ponta Grossa (PG L502)</text>
  <text x="250" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#d99200">Comparativo de Adoção Segue ON (%): Julho vs Agosto 2026</text>
  <line x1="30" y1="64" x2="470" y2="64" stroke="#222222" stroke-width="1" />

  <!-- Y Axis -->
  <line x1="75" y1="85" x2="75" y2="215" stroke="#333333" stroke-width="1" />
  <!-- X Axis -->
  <line x1="75" y1="215" x2="420" y2="215" stroke="#555555" stroke-width="1.5" />

  <!-- Grid lines & Y scale (Scale: 0 to 30%) -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="end">
    <text x="65" y="219">0%</text>
    <line x1="75" y1="172" x2="420" y2="172" stroke="#1f2937" stroke-dasharray="3" /> <text x="65" y="176">10%</text>
    <line x1="75" y1="128" x2="420" y2="128" stroke="#1f2937" stroke-dasharray="3" /> <text x="65" y="132">20%</text>
    <line x1="75" y1="85" x2="420" y2="85" stroke="#1f2937" stroke-dasharray="3" /> <text x="65" y="89">30%</text>
  </g>

  <!-- Bar 1: Julho (2,28%) -->
  <rect x="135" y="205" width="75" height="10" fill="#ef4444" rx="4" />
  <text x="172" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fca5a5">2,28%</text>
  <text x="172" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#aaaaaa">Julho/26</text>

  <!-- Bar 2: Agosto (27,0%) -->
  <rect x="275" y="98" width="75" height="117" fill="#d99200" rx="4" />
  <text x="312" y="88" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">27,0%</text>
  <text x="312" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d99200">Agosto/26</text>

  <!-- Growth badge -->
  <rect x="375" y="92" width="105" height="32" fill="#14532d" stroke="#16a34a" stroke-width="1.5" rx="6" />
  <text x="427" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#86efac">+24,72 pp 🚀</text>

  <!-- Trend Curve -->
  <path d="M 172 190 Q 240 100 312 85" fill="none" stroke="#d99200" stroke-width="2.5" stroke-dasharray="4,3" />
</svg>
