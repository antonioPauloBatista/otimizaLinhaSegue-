<svg width="1000" height="390" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Black Background -->
  <rect width="100%" height="100%" fill="#000000" />

  <!-- Clean Title -->
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">ADOÇÃO SEGUE</text>
  <line x1="40" y1="62" x2="960" y2="62" stroke="#333333" stroke-width="1" />

  <!-- LISTA LIMPA APENAS COM OS TÍTULOS -->

  <!-- ITEM 1 -->
  <g transform="translate(40, 105)">
    <circle cx="16" cy="16" r="16" fill="#d99200" />
    <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">1</text>
    <text x="48" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d99200">CASOS DE PERDA DE PERFORMANCE PÓS IMPLANTAÇÃO</text>
  </g>

  <!-- ITEM 2 -->
  <g transform="translate(40, 185)">
    <circle cx="16" cy="16" r="16" fill="#d99200" />
    <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">2</text>
    <text x="48" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d99200">PROBLEMA DE CÁLCULO DO BENEFÍCIO COM SETPOINTS IGUAIS (GLOBAL ENDEREÇAR)</text>
  </g>

  <!-- ITEM 3 -->
  <g transform="translate(40, 265)">
    <circle cx="16" cy="16" r="16" fill="#d99200" />
    <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">3</text>
    <text x="48" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d99200">VERSÃO SEGUE CAMADA PLC (Algumas plantas têm implementação diferente para novas versões)</text>
  </g>

  <!-- ITEM 4 -->
  <g transform="translate(40, 345)">
    <circle cx="16" cy="16" r="16" fill="#d99200" />
    <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">4</text>
    <text x="48" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d99200">O SEGUE MELHORA OU NÃO MINHA LINHA?</text>
  </g>

</svg>
